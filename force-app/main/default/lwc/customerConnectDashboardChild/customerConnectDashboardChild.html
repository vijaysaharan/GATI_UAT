<template>
  
        <table class="slds-table slds-table_cell-buffer slds-table_bordered" aria-labelledby="element-with-table-label other-element-with-table-label">
            <thead>
                <tr class="slds-line-height_reset">
                  <th class="" scope="col">
                    <div class="slds-truncate" title="Type of Customers">Type of<br/> Customers</div>
                  </th>
                  <th class="" scope="col" colspan="3">
                    <div class="slds-truncate" title="Type of Customers">Daily Avge Sales call per <br/>BDE/BDM 
                      <lightning-helptext content="From Customer Connect"></lightning-helptext></div>
                  </th>
                  <th class="" scope="col">
                    <div class="slds-truncate" title="Type of Customers">Avge  size of Sign ups<br/> (Monthly Revenue)
                      <lightning-helptext content="Biz source Customer 360"></lightning-helptext></div>
                  </th>
                  <th class="" scope="col"  colspan="3">
                    <div class="slds-truncate" title="Type of Customers">% of Sign ups VS Total
                      <lightning-helptext content="Opportunities - Hit Rate(cut off - Last day of the month) (Opportunity =New Contract & Close one"></lightning-helptext> </div>
                  </th>
                  <th class="" scope="col">
                    <div class="slds-truncate" title="Type of Customers">Avge No of days from<br/> opportunities to Signup
                      <lightning-helptext content="Sign up date (Contract Activation Date) - Opportunity Created date"></lightning-helptext></div>
                  </th>
                  <th class="" scope="col">
                    <div class="slds-truncate" title="Type of Customers">Sign-ups Vs Sold number % Trading<br/>
                      <lightning-helptext content="(Cut off 60 days after code creation) (Velocity) (Sign-ups Vs Sold number % Trading (Cut off 60 days after code creation) First docket Booking date - Contract Activation date ( Biz source customer 360 )"></lightning-helptext></div>
                  </th>
                  <th class="" scope="col">
                    <div class="slds-truncate" title="Type of Customers">Promised Revenue<br/> VS Actual Trading % <br/>
                      <lightning-helptext content="NBD Compliance"></lightning-helptext></div>
                  </th>

                </tr>
            </thead>
            <tbody>
              <template if:true={recordList}>
                <template for:each={tableList} for:item="item">
                 <tr key={item.colList}>
                  <template for:each={item.colList} for:item="data">
                    <td key={data}>{data}</td>
                  </template>

<!-- <td>{item.retailData}</td>
                  <td>{item.msmeData}</td>
                  <td>{item.strategicData}</td>
                  <td>{item.kealData}</td> -->
</tr>

</template>
</template>
</tbody>
</table>


</template>
