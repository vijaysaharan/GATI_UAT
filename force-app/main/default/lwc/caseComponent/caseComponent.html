<template>
    <lightning-card>
        <div lwc:if={isLoading}>
            <lightning-spinner size="large"></lightning-spinner>
        </div>
        <div class="center-heading slds-p-around_medium slds-text-heading_medium">
            New Case
        </div>
        <div class="slds-container_center slds-container_large slds-container">
            <lightning-accordion allow-multiple-sections-open class="accordion" active-section-name={activeSections}>
                <lightning-record-edit-form object-api-name="Case" aura-id="caseform" onsuccess={handleSuccess} onsubmit={handleSubmit} record-type-id={recordTypeId}>
                    <div class=" slds-grid slds-gutters slds-wrap">
                        <template if:true={isError}>
                            <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                                <span class="slds-assistive-text">error</span>
                                <span class="slds-icon_container slds-icon-utility-error slds-m-right_x-small"
                                    title="Description of icon when needed">
                                    <svg class="slds-icon slds-icon_x-small" aria-hidden="true">
                                        <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#error"></use>
                                    </svg>
                                </span>
                                <h2>Complaint already register against this docket.</h2>
                            </div>
                        </template>
                        <div class="slds-col slds-large-size_12-of-12">
                            <lightning-accordion-section name="basic" label="Basic Details">
                                <div class="slds-grid slds-wrap">
                                    <div class="slds-col slds-size_12-of-12 slds-large-size_4-of-12 slds-p-around_x-small">
                                        <lightning-input-field 
                                            field-name="Type" 
                                            required 
                                            value={type} 
                                            name="Type"
                                            onchange={handleChange}
                                        ></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_12-of-12 slds-large-size_4-of-12 slds-p-around_x-small">
                                        <lightning-input-field 
                                            field-name="Sub_Type__c" 
                                            value={subtype}
                                            name="Sub_Type__c" 
                                            onchange={handleChange}
                                        ></lightning-input-field>
                                    </div>
                                    <template if:true={DocketValidate}>
                                        <div class="slds-col slds-size_12-of-12 slds-large-size_4-of-12 slds-p-around_x-small">
                                            <lightning-input 
                                                type="text" 
                                                read-only={docketValid} 
                                                onblur={checkError}
                                                variant="label-inline" 
                                                label="Docket Number"
                                                message-when-bad-input="Please enter Valid Docket Number"
                                                class="docketNumber" 
                                                required 
                                                value={docket} 
                                                name="Docket_Number__c"
                                                onchange={assignDocket}
                                            ></lightning-input>
                                            <template if:true={invalidDocket}>
                                                <div class="slds-text-color_error slds-p-top_x-small">Please enter valid docket number</div>
                                            </template>
                                            <template if:true={docketLength}>
                                                <template if:true={isLoading}>
                                                    Please wait...Validating Docket number 
                                                    <img style="width: 5vh;" src={loadingIcon} alt="">
                                                </template>
                                                <template if:true={docketValid}>
                                                    Docket is Validated 
                                                    <img style="width: 3vh;" src={completedIcon} alt="">
                                                </template>
                                            </template>
                                        </div>
                                    </template>
                                    <div class="slds-col slds-size_12-of-12 slds-large-size_4-of-12 slds-p-around_x-small">
                                        <lightning-input-field 
                                            field-name="RecordTypeId" 
                                            value={recordTypeId} 
                                            disabled
                                        ></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-large-size_12-of-12">
                                        <div class="slds-align_absolute-center slds-p-vertical_medium" style="border-bottom: 1px solid rgb(221, 219, 218);">
                                            <lightning-button 
                                                variant="brand" 
                                                type="submit" 
                                                label="Continue"
                                                disabled={disableContinue}
                                            ></lightning-button>
                                            <lightning-button 
                                                class="slds-m-left_x-small" 
                                                label="Cancel"
                                                onclick={handleCancel}
                                            ></lightning-button>
                                        </div>
                                    </div>
                                </div>
                            </lightning-accordion-section>
                        </div>
                    </div>
                </lightning-record-edit-form>
            </lightning-accordion>
        </div>
    </lightning-card>
    
    <template if:false={casePage}>
        <lightning-card>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="modalSection slds-modal slds-fade-in-open">
                <div class="slds-modal__container" style="width:70%;max-width:80%">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close">
                            <lightning-icon variant="inverse" onclick={closeModal} alternative-text="close" icon-name="utility:close" size="small"></lightning-icon>
                        </button>
                        <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Prospect Pickup</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                        <c-propect-pickup-create-request 
                            def-value={type} 
                            record-type-id={recordTypeId}
                            onclosemodalchild={closeModal}
                        ></c-propect-pickup-create-request>
                    </div>
                </div>
            </section>
            <div class="backdropDiv slds-backdrop slds-backdrop_open"></div>
        </lightning-card>
    </template>

    <!-- this section for pickup -->
    <template if:false={pickupCase}>
        <lightning-card>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="modalSection slds-modal slds-fade-in-open">
                <div class="slds-modal__container" style="width:70%;max-width:80%">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close">
                            <lightning-icon variant="inverse" onclick={handleCancel} alternative-text="close" icon-name="utility:close" size="small"></lightning-icon>
                        </button>
                        <h2 id="modal-heading-02" class="slds-modal__title slds-hyphenate">Pickup</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-2">
                        <c-pickup-component record-type-id={recordTypeId}></c-pickup-component>
                    </div>
                </div>
            </section>
            <div class="backdropDiv slds-backdrop slds-backdrop_open"></div>
        </lightning-card>
    </template>
</template>
