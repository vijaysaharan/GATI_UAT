<template>
    <div class="slds-p-around_medium">
        <div lwc:if={isLoading}>
            <lightning-spinner alternative-text="Loading" size="x-small"></lightning-spinner>
        </div>
        <div class="slds-var-m-bottom_small">
            <div class="slds-text-title_bold slds-var-p-bottom_small">Docket Number</div>
            <lightning-input 
                label="Docket Number" 
                variant="label-hidden"
                value={docketNumber} 
                onchange={handleDocketChange} 
            ></lightning-input>
        </div>
    </div>
    <footer class="slds-align_absolute-center slds-p-vertical_medium slds-border_top">
        <lightning-button
            label="Update"
            onclick={handleUpdate}
            variant="brand"
            disabled={isDisabled}>
        </lightning-button>
    </footer>
</template>
